name: Package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prism-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate Compose startup configurations
        env:
          POSTGRES_PASSWORD: compose-validation-only
          DATABASE_HOST: postgres.example
          DATABASE_PASSWORD: compose-validation-only
          REDIS_HOST: redis.example
        run: |
          for file in deploy/docker-compose*.yml; do
            docker compose -f "$file" config --quiet
          done
          python -m unittest discover -s prism-adapter -p 'test_docker_runtime.py' -v
          python -m unittest discover -s deploy/tests -p 'test_prism_compose.py' -v
      - uses: docker/setup-buildx-action@v3
      - name: Build Prism runtime for smoke testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: prism-adapter/Dockerfile
          load: true
          tags: sub2api-prism-adapter:ci
          cache-from: type=gha,scope=prism-adapter
          cache-to: type=gha,mode=max,scope=prism-adapter
      - name: Verify sandbox, private loopback, authentication and persistent state
        run: python deploy/tests/prism_docker_smoke.py --image sub2api-prism-adapter:ci
      - name: Set lowercase owner
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified Prism runtime
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: prism-adapter/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/sub2api:prism-main
            ghcr.io/${{ steps.owner.outputs.value }}/sub2api:prism-main-${{ github.sha }}
          cache-from: type=gha,scope=prism-adapter

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  package:
    needs: [build-frontend, prism-adapter]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: |
          expected_version="go$(awk '$1 == "go" { print $2; exit }' backend/go.mod)"
          actual_version="$(go env GOVERSION)"
          echo "Expected Go version: ${expected_version}"
          echo "Actual Go version: ${actual_version}"
          test "${actual_version}" = "${expected_version}"

      - name: Set lowercase owner for GoReleaser templates
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GoReleaser snapshot build
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: build --snapshot --clean
        env:
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: skip
          TAG_MESSAGE: snapshot package build

      - name: Build and push GHCR image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/sub2api:main
            ghcr.io/${{ steps.lowercase.outputs.owner }}/sub2api:main-${{ github.sha }}
          build-args: |
            VERSION=main
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-dist
          path: dist/**
          retention-days: 7
