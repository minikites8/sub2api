name: Package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        working-directory: frontend
        run: pnpm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1

  build-reauth-runtime:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - env:
          VERSION: 0.0.0-snapshot
          ARCH: ${{ matrix.arch }}
        run: bash tools/reauth-runtime/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: package-runtime-${{ matrix.arch }}
          path: reauth-output/*.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  package:
    needs: [build-frontend, build-reauth-runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/internal/web/dist/

      - uses: actions/download-artifact@v8
        with:
          pattern: package-runtime-*
          path: reauth-input
      - name: Embed architecture-specific re-login runtimes
        run: |
          for arch in amd64 arm64; do
            cp "reauth-input/package-runtime-$arch/"*.tar.gz "backend/internal/reauthruntime/$arch.bundle"
          done

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: |
          expected_version="go$(awk '$1 == "go" { print $2; exit }' backend/go.mod)"
          actual_version="$(go env GOVERSION)"
          echo "Expected Go version: ${expected_version}"
          echo "Actual Go version: ${actual_version}"
          test "${actual_version}" = "${expected_version}"

      - name: Set lowercase owner for GoReleaser templates
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GoReleaser snapshot build
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: build --snapshot --clean
        env:
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.lowercase.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: skip
          TAG_MESSAGE: snapshot package build

      - name: Build and push GHCR image
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.lowercase.outputs.owner }}/sub2api:main
            ghcr.io/${{ steps.lowercase.outputs.owner }}/sub2api:main-${{ github.sha }}
          build-args: |
            VERSION=main
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
            NPM_CONFIG_REGISTRY=https://registry.npmjs.org

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: package-dist
          path: dist/**
          retention-days: 7
